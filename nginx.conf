server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A federated remote is fetched cross-origin by the shell, so remoteEntry.json
    # and styles.css must be CORS-readable or the shell cannot load the module.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    # Remotes are built with outputHashing:"media" — remoteEntry.json, styles.css
    # and the JS chunks are UNHASHED, so they must never be cached immutably or a
    # redeploy keeps serving the old remote.
    add_header Cache-Control "no-cache" always;

    # Reached only through the shell's proxy, so redirects must be relative — an absolute
    # one carries this server's own http://…:80 identity (wrong scheme, wrong port).
    absolute_redirect off;
    port_in_redirect  off;

    # No `$uri/`: in a SPA it only ever produced directory redirects, which is what the
    # two directives above exist to keep correct.
    location / {
        try_files $uri /index.html;
    }

    # Only genuinely fingerprinted/static media gets a long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
