<!-- Même mise en page qu'une section de /payroll/admin (et de /rh/admin) : fil d'Ariane seul,
     en-tête de section (titre + nombre, aide, recherche et filtre à droite), puis le tableau,
     « N collaborateurs » et la pagination. Recherche, filtres et pages côté serveur (`load()`). -->
<div class="ec-content">
  <daf-page [breadcrumbs]="true">
    <daf-page-header
      class="ec-breadcrumb-header"
      [title]="'PAYROLL.EMPLOYEE_CONFIG.TITLE' | translate"
      [breadcrumbs]="breadcrumbs()">
    </daf-page-header>

    <div class="admin-section">
      <app-admin-section-header
        [title]="('PAYROLL.EMPLOYEE_CONFIG.TITLE' | translate) + ' (' + totalElements() + ')'"
        [subtitle]="'PAYROLL.EMPLOYEE_CONFIG.LIST_SUBTITLE' | translate">
        <div class="admin-search">
          <daf-search-toolbar
            [card]="false"
            [placeholder]="'PAYROLL.ENGINE_RESULTS.SEARCH_EMPLOYEE_PLACEHOLDER' | translate"
            [value]="searchText()"
            (valueChange)="onSearchTextChange($event)"
            [debounce]="300"
            [filterFields]="filterFields()"
            [filterConfig]="filterConfig()"
            (filterApply)="applyFilters($event)">
          </daf-search-toolbar>
        </div>
      </app-admin-section-header>

      @if (error()) {
        <div class="admin-error-banner" role="alert">{{ error() }}</div>
      } @else if (loading() && employees().length === 0) {
        <app-admin-spinner />
      } @else if (employees().length === 0) {
        <div class="admin-empty">
          <p>{{ 'PAYROLL.ENGINE_RESULTS.EMPTY_EMPLOYEES' | translate }}</p>
        </div>
      } @else {
        <!-- Page suivante / nouvelle recherche en vol : le tableau reste affiché, estompé. -->
        <div class="admin-table-scroll" [class.is-loading]="loading()">
          <daf-data-table [columns]="employeeColumns()" [rows]="employeeRows()" [config]="tableConfig()"
            (sortChange)="onEmployeeSort($event)" (resetClick)="onEmployeeSort(null)" />
        </div>
        <app-admin-table-footer
          [total]="totalElements()" [page]="page()" [totalPages]="totalPages()"
          [unit]="'PAYROLL.ADMIN_HOME.COUNT.EMPLOYEES' | translate"
          (pageChange)="onPageChange($event)" />
      }
    </div>
  </daf-page>
</div>
