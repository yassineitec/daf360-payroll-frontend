<daf-page [loading]="loading()" [breadcrumbs]="true">
  <daf-page-header
    [title]="'PAYROLL.CALIBRATION.TITLE' | translate"
    [subtitle]="'PAYROLL.CALIBRATION.SUBTITLE' | translate"
    [breadcrumbs]="breadcrumbs()">
  </daf-page-header>

  <div class="page-body">
    <!-- Open cycle -->
    <daf-card [options]="{ variant: 'outlined', padding: 'lg', radius: 'xl' }">
      <daf-section-title [title]="'PAYROLL.CALIBRATION.OPEN_CYCLE_TITLE' | translate" />

      <div class="form-grid">
        <daf-select
          [options]="paysOptions()"
          [selected]="paysId() ? ['' + paysId()] : []"
          [config]="{ label: 'PAYROLL.CALIBRATION.PAYS' | translate, placeholder: 'PAYROLL.SELECT.PAYS_PLACEHOLDER' | translate, searchable: true, fullWidth: true, required: true }"
          (selectedChange)="paysId.set($event[0] ? +$event[0] : null)">
        </daf-select>

        <daf-form-field
          [options]="{ label: 'PAYROLL.CALIBRATION.PERIOD_LABEL' | translate, placeholder: '2025-01', required: true }"
          [value]="period()"
          (valueChange)="period.set(($event ?? '').toString())">
        </daf-form-field>
      </div>

      <div class="form-actions">
        <daf-button
          [label]="'PAYROLL.CALIBRATION.OPEN_CYCLE_BUTTON' | translate"
          variant="primary"
          [options]="{ loading: loading(), disabled: !canOpenCycle() || loading() }"
          (onClick)="openCycle()">
        </daf-button>
        <daf-button
          [label]="'PAYROLL.CALIBRATION.LOAD_CYCLES_BUTTON' | translate"
          variant="ghost"
          [options]="{ disabled: !paysId() }"
          (onClick)="loadCycles()">
        </daf-button>
      </div>

      @if (error()) {
        <div class="alert alert--error">{{ error() }}</div>
      }
    </daf-card>

    <!-- Upload actuals -->
    <daf-card [options]="{ variant: 'outlined', padding: 'lg', radius: 'xl' }">
      <daf-section-title [title]="'PAYROLL.CALIBRATION.UPLOAD_TITLE' | translate" />

      <div class="form-grid">
        <daf-form-field
          [options]="{ label: 'PAYROLL.CALIBRATION.CYCLE_ID_LABEL' | translate, type: 'number', placeholder: 'PAYROLL.CALIBRATION.CYCLE_ID_PLACEHOLDER' | translate }"
          [value]="uploadCycleId()"
          (valueChange)="uploadCycleId.set($event ? +$event : null)">
        </daf-form-field>
      </div>

      <daf-file-upload
        [config]="{
          label: 'PAYROLL.CALIBRATION.CSV_FILE_LABEL' | translate,
          accept: '.csv',
          hint: 'PAYROLL.CALIBRATION.CSV_FORMAT_HINT' | translate,
          disabled: loading()
        }"
        [(files)]="uploadedFiles">
      </daf-file-upload>

      <div class="form-actions">
        <daf-button
          [label]="'PAYROLL.CALIBRATION.UPLOAD_BUTTON' | translate"
          variant="primary"
          [options]="{ loading: loading(), disabled: !canUpload() || loading() }"
          (onClick)="uploadActuals()">
        </daf-button>
      </div>
    </daf-card>

    <!-- Cycles list -->
    @if (cycles().length) {
      <daf-card [options]="{ variant: 'outlined', padding: 'lg', radius: 'xl' }">
        <daf-section-title [title]="'PAYROLL.CALIBRATION.CYCLES_TITLE' | translate: { count: cycles().length }" />
        <daf-data-table [columns]="cycleColumns()" [rows]="cycleRows()"></daf-data-table>
      </daf-card>
    }
  </div>
</daf-page>
