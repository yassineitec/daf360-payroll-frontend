<daf-page>
  <daf-page-header
    [title]="'PAYROLL.CANDIDATE_SIMULATION.TITLE' | translate"
    [subtitle]="'PAYROLL.CANDIDATE_SIMULATION.SUBTITLE' | translate">
  </daf-page-header>

  <div class="page-body">
    <!-- ── Bandeau exécutif : directement sous le header, comme les pages finance
         (invoice-list, payments-dashboard) — une section nue en grille, sans carte
         englobante, avant tout filtre. TOUJOURS affiché : à 0 tant
         qu'aucun pays n'est choisi dans le filtre, mis à jour dès qu'il l'est. ──── -->
    <section class="grid grid-cols-4 gap-2 sm:gap-6 kpi-section transition-opacity"
             [class.opacity-60]="candLoading()">
      <!-- Quatre tuiles de RÉSULTAT, aucune cliquable (le statut se filtre dans le panneau) :
           ce que la DAF doit traiter, ce qu'elle a accepté, la pression salariale, le volume. -->
      <daf-metric-card
        [label]="'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_PENDING' | translate"
        [value]="'' + candidateKpis().pending"
        [delta]="pendingDelta()"
        [options]="{ icon: 'schedule', iconColor: candidateKpis().pending ? 'text-warning' : undefined,
                     iconBg: candidateKpis().pending ? 'bg-warning/10' : undefined,
                     help: 'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_PENDING_HELP' | translate }">
      </daf-metric-card>
      <daf-metric-card
        [label]="'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_APPROVAL_RATE' | translate"
        [value]="candidateKpis().approvalRate + ' %'"
        [delta]="approvalDelta()"
        [options]="{ valueColor: 'text-success', icon: 'task_alt', iconColor: 'text-success', iconBg: 'bg-success/10',
                     help: 'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_APPROVAL_HELP' | translate }">
      </daf-metric-card>
      <daf-metric-card
        [label]="'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_GAP' | translate"
        [value]="gapValue()"
        [delta]="gapDelta()"
        [options]="{ icon: 'compare_arrows', help: 'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_GAP_HELP' | translate }">
      </daf-metric-card>
      <daf-metric-card
        [label]="'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_TOTAL' | translate"
        [value]="'' + candidateKpis().total"
        [delta]="totalDelta()"
        [options]="{ icon: 'groups', help: 'PAYROLL.CANDIDATE_SIMULATION.CAND_KPI_TOTAL_HELP' | translate, helpPlacement: 'top' }">
      </daf-metric-card>
    </section>

    <!-- Erreur : même bandeau que les autres pages paie (la lib n'a pas d'alerte). -->
    @if (candError()) {
      <div class="notice notice--danger" role="alert">
        <span class="material-symbols-outlined notice__icon">error</span>
        <span>{{ candError() }}</span>
      </div>
    }

    <!-- ── Liste des candidats — recherche/filtre/vue carte-tableau, comme
         /finance/affaires (`daf-search-toolbar` embarque les trois). Le PAYS se choisit
         dans le bouton filtre, avec le statut. Toujours affiché, même vide : le message
         de liste vide (`emptyMessage()`) dit s'il faut choisir un pays. ──────────── -->
    <daf-search-toolbar
      [placeholder]="'PAYROLL.CANDIDATE_SIMULATION.SEARCH_PLACEHOLDER' | translate"
      [value]="searchText()"
      (valueChange)="onSearchTextChange($event)"
      [debounce]="300"
      [filterFields]="filterFields()"
      [filterConfig]="filterConfig()"
      (filterApply)="applyFilters($event)"
      [views]="viewOptions()"
      [(view)]="viewMode"
      [table]="candidateTable() ?? null">
    </daf-search-toolbar>

    @if (viewMode() === 'grid') {
      <!-- Même grille que /finance/affaires (`affaires-cards-section`) : 3 colonnes,
           `gap-5`, squelettes de 248 px au chargement, état vide en pointillés. -->
      <div class="grid grid-cols-3 gap-5 cand-cards">
        @if (candLoading() && !pagedCandidateCards().length) {
          @for (i of [0, 1, 2, 3, 4, 5]; track i) {
            <daf-skeleton variant="block" radius="xl" width="100%" height="248px" />
          }
        } @else {
          @for (card of pagedCandidateCards(); track card.id) {
            <daf-entity-card
              [options]="card.options"
              (cardClick)="openCandidateById(card.id)"
              (viewClick)="openCandidateById(card.id)">
            </daf-entity-card>
          } @empty {
            <!-- État vide : `daf-card` de la lib (icône + description), sur toute la largeur. -->
            <daf-card class="col-span-full"
              [options]="{ variant: 'outlined', padding: 'lg', radius: 'xl', icon: 'search_off', description: emptyMessage() }" />
          }
        }
      </div>
    } @else {
      <!-- Tableau nu, comme l'exemple de la bibliothèque (demo-app) : pas de daf-card
           autour — le tableau porte déjà son propre cadre. -->
      <daf-data-table
        [columns]="candidateColumns()"
        [rows]="pagedCandidateRows()"
        [config]="candidateTableConfig()"
        (sortChange)="onCandidateSort($event)"
        (resetClick)="onCandidateSort(null)"
        (rowClick)="openCandidateById($event['candidateId'])">
      </daf-data-table>
    }

    <!-- ── Pagination, comme /finance/affaires (`daf-pagination` de la bibliothèque) ── -->
    <daf-pagination
      [currentPage]="page()"
      [totalPages]="totalPages()"
      [totalElements]="candidateRows().length"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[10, 20, 50, 100]"
      [perPageLabel]="'PAYROLL.COMMON.PAGINATION.PER_PAGE' | translate"
      [summaryLabel]="'PAYROLL.COMMON.PAGINATION.SUMMARY' | translate"
      [firstPageLabel]="'PAYROLL.COMMON.PAGINATION.FIRST' | translate"
      [lastPageLabel]="'PAYROLL.COMMON.PAGINATION.LAST' | translate"
      [config]="{ showFirstLast: true }"
      (pageChange)="page.set($event)"
      (pageSizeChange)="onPageSizeChange($event)">
    </daf-pagination>
  </div>
</daf-page>
